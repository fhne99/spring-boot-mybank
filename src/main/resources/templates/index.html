<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MyBank - Clients</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<header class="container">
    <nav>
        <ul>
            <li><strong>MyBank</strong></li>
        </ul>
        <ul>
            <li><a th:href="@{/login}" id="link-login">Connexion</a></li>
            <li><a th:href="@{/register}" id="link-register">Créer un compte</a></li>
            <li><a th:href="@{/accounts}" id="link-myaccounts" style="display:none;">Mes comptes</a></li>
        </ul>
    </nav>
</header>
<main class="container">
    <h1>Clients</h1>

    <section>
        <h2>Liste des clients</h2>
        <table>
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
            </tr>
            </thead>
            <tbody id="clients-tbody">
            <tr th:if="${clients.size() > 0}" th:each="client : ${clients}">
                <td th:text="${client.lastName}"/>
                <td th:text="${client.firstName}"/>
            </tr>
            <tr th:unless="${clients.size() > 0}" th:each="client : ${clients}">
                <td colspan="2">Aucun client</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Toggle header links based on auth
        const linkLogin = document.getElementById('link-login');
        const linkRegister = document.getElementById('link-register');
        const linkMy = document.getElementById('link-myaccounts');
        try {
            if (Auth && Auth.token && Auth.clientId) {
                if (linkLogin) linkLogin.style.display = 'none';
                if (linkRegister) linkRegister.style.display = 'none';
                if (linkMy) linkMy.style.display = '';
            }
        } catch (_) {
        }
    });
    const Auth = {
        get token() {
            return localStorage.getItem('jwt');
        },
        set token(t) {
            if (t) localStorage.setItem('jwt', t); else localStorage.removeItem('jwt');
        },
        get clientId() {
            return localStorage.getItem('clientId');
        },
        set clientId(c) {
            if (c) localStorage.setItem('clientId', c); else localStorage.removeItem('clientId');
        },
        get login() {
            return localStorage.getItem('login');
        },
        set login(l) {
            if (l) localStorage.setItem('login', l); else localStorage.removeItem('login');
        },
        logout() {
            try {
                localStorage.removeItem('jwt');
                localStorage.removeItem('clientId');
                localStorage.removeItem('login');
            } catch (_) {
            }
            // Redirect to login page
            window.location.href = '/login';
        }
    };

    async function fetchWithRedirect(url, options = {}, withRedirect = true) {
        try {
            const res = await fetch(url, options);
            if (!res.ok) {
                if (withRedirect) {
                    // Decide where to redirect based on status
                    const status = res.status;
                    if (status === 401) {
                        // Keep current UX: redirect to login for unauthorized
                        window.location.href = '/login';
                    } else if (status === 403) {
                        window.location.href = '/error/403';
                    } else if (status === 404) {
                        window.location.href = '/error/404';
                    } else if (status >= 500) {
                        window.location.href = '/error/500';
                    } else {
                        // Fallback
                        window.location.href = '/error/generic';
                    }
                } else {
                    throw new Error('Error ' + res.status);
                }
            }
            return res.json();
        } catch (e) {
            if (withRedirect) {
                // Network error or CORS, show generic error page
                window.location.href = '/error/generic';
            }
            throw e;
        }
    }

    window.Auth = Auth;
</script>
</body>
</html>
